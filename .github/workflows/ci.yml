name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Runs unit and integration tests; Testcontainers uses the Docker daemon of the runner
      - name: Build and test
        run: mvn -B verify

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Test results"
            echo
            echo "| Test class | Result |"
            echo "| --- | --- |"
            for report in target/surefire-reports/*.txt; do
              [ -e "$report" ] || continue
              name=$(sed -n 's/^Test set: //p' "$report")
              result=$(grep -m1 '^Tests run:' "$report" | sed 's/, Time elapsed.*//')
              echo "| ${name##*.} | $result |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t inventory-api .
